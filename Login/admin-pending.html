<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Approvals — Barangay 59-A</title>
  <link rel="stylesheet" href="auth-base.css">
  <link rel="stylesheet" href="auth-components.css">
  <link rel="stylesheet" href="responsive.css">
  <script src="/messagebox.js"></script>
</head>
<body>
<div class="auth-table-bg">
  <div style="width:100%; max-width:960px;">

    <div class="table-page-header">
      <div style="display:flex; align-items:center; gap:16px;">
        <button class="table-page-back" onclick="location.href='admin-menu.html'">← Back</button>
        <div>
          <div class="section-title">Pending Approvals</div>
          <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">Review and approve registration requests</div>
        </div>
      </div>
    </div>

    <div class="auth-alert" id="pendingAlert" style="margin-bottom:16px;"></div>

    <div class="auth-table-wrap">
      <table class="auth-table" id="pendingTable">
        <thead>
          <tr>
            <th>Last Name</th><th>First Name</th><th>Middle Name</th>
            <th>Role</th><th>Phone</th><th>Submitted</th><th>Action</th>
          </tr>
        </thead>
        <tbody id="pendingTbody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">✅</div>
        <div class="empty-title">All caught up!</div>
        <div class="empty-desc">No pending registration requests.</div>
      </div>
    </div>

  </div>
</div>
<script>
  const user = JSON.parse(sessionStorage.getItem('current_user') || 'null');
  if (!user) {
    location.href = 'login.html';
  }

  function showAlert(msg, type) {
    const el = document.getElementById('pendingAlert');
    el.textContent = msg;
    el.className = 'auth-alert show ' + type;
    setTimeout(() => {
      el.className = 'auth-alert';
    }, 3000);
  }

  async function loadPendingAccounts() {
    try {
      const response = await fetch('/api/accounts/pending');
      const accounts = await response.json();
      
      const tbody = document.getElementById('pendingTbody');
      const table = document.getElementById('pendingTable');
      const empty = document.getElementById('emptyState');
      
      tbody.innerHTML = '';
      
      if (!accounts || accounts.length === 0) {
        table.style.display = 'none';
        empty.style.display = 'block';
        return;
      }
      
      table.style.display = '';
      empty.style.display = 'none';
      
      accounts.forEach(account => {
        const tr = document.createElement('tr');
        const createdDate = new Date(account.createdAt).toLocaleDateString('en-PH');
        
        tr.innerHTML = `
          <td><strong>${account.lastName || '—'}</strong></td>
          <td>${account.firstName || '—'}</td>
          <td>${account.middleName || '—'}</td>
          <td><span class="role-badge pending">${account.role || '—'}</span></td>
          <td style="font-family:monospace;font-size:13px;">${account.phone || '—'}</td>
          <td style="color:var(--text-muted);font-size:12.5px;">${createdDate}</td>
          <td style="display:flex;gap:8px;">
            <button class="btn-primary" style="width:auto;padding:6px 16px;font-size:12.5px;" onclick="approveAccount('${account._id}', '${account.firstName} ${account.lastName}')">Approve</button>
            <button class="btn-danger" onclick="rejectAccount('${account._id}', '${account.firstName} ${account.lastName}')">Reject</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    } catch (error) {
      console.error('Error loading pending accounts:', error);
      showAlert('Error loading pending accounts. Please try again.', 'error');
    }
  }

  async function approveAccount(accountId, accountName) {
    try {
      const response = await fetch(`/api/accounts/${accountId}/approve`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          approvedBy: user.role + ' ' + user.firstName
        })
      });

      const data = await response.json();

      if (data.success) {
        showAlert(accountName + ' approved successfully.', 'success');
        loadPendingAccounts();
      } else {
        showAlert(data.message || 'Failed to approve account.', 'error');
      }
    } catch (error) {
      console.error('Approval error:', error);
      showAlert('Error approving account. Please try again.', 'error');
    }
  }

  async function rejectAccount(accountId, accountName) {
    if (!(await BrgyMessageBox.confirm('Reject this registration request from ' + accountName + '?'))) return;

    try {
      const response = await fetch(`/api/accounts/${accountId}/reject`, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json'
        }
      });

      const data = await response.json();

      if (data.success) {
        showAlert(accountName + ' rejected and deleted.', 'info');
        loadPendingAccounts();
      } else {
        showAlert(data.message || 'Failed to reject account.', 'error');
      }
    } catch (error) {
      console.error('Rejection error:', error);
      showAlert('Error rejecting account. Please try again.', 'error');
    }
  }

  // Load pending accounts when page loads
  document.addEventListener('DOMContentLoaded', loadPendingAccounts);
  // Also load if page is already loaded
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadPendingAccounts);
  } else {
    loadPendingAccounts();
  }
</script>
</body>
</html>
