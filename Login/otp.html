<script>
  const inputs = document.querySelectorAll('.otp-input');
  const SECRET = "l69xAAm3"; // Hidden secret key
  let currentEncoded = ""; // Store encoded string for verification

  // Base64 encode function
  function encodeBase64(str) {
    return btoa(str);
  }

  // SHA-256 hash function
  async function sha256(message) {
    const msgBuffer = new TextEncoder().encode(message);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
  }

  // Generate OTP based on encoded string and time window (accepts current + previous window)
  async function generateCode(encoded, timeWindow = null) {
    try {
      const decoded = atob(encoded);
      if (timeWindow === null) {
        const now = Math.floor(Date.now() / 1000);
        timeWindow = Math.floor(now / 60);
      }
      const combined = decoded + "|" + timeWindow;
      const hash = await sha256(combined);
      const code = parseInt(hash.slice(-8), 16) % 1000000;
      return code.toString().padStart(6, '0');
    } catch (error) {
      console.error('Error generating OTP:', error);
      return null;
    }
  }

  // Verify OTP against current and previous time windows
  async function verifyCode(encoded, userCode) {
    const now = Math.floor(Date.now() / 1000);
    const currentWindow = Math.floor(now / 60);
    const previousWindow = currentWindow - 1;

    // Try current time window
    const currentOtp = await generateCode(encoded, currentWindow);
    if (userCode === currentOtp) {
      return true;
    }

    // Try previous time window (handles codes entered near time boundary)
    const previousOtp = await generateCode(encoded, previousWindow);
    if (userCode === previousOtp) {
      return true;
    }

    return false;
  }

  // Show masked phone number and generate QR code
  const phone = sessionStorage.getItem('otp_phone');
  const user = JSON.parse(sessionStorage.getItem('otp_user') || '{}');
  
  if (!phone) {
    location.href = 'login.html';
  } else {
    const masked = phone.slice(0, 4) + '****' + phone.slice(-3);
    
    // Normalize phone: remove leading 0 if present to match admin-accounts format
    const normalizedPhone = phone.startsWith('0') ? phone.substring(1) : phone;
    
    // Generate encoded string: firstName + middleName + lastName + "|" + phone + "|" + SECRET
    const fullName = ((user.firstName || '') + ' ' + (user.middleName || '') + ' ' + (user.lastName || '')).trim();
    const combined = fullName + '|' + normalizedPhone + '|' + SECRET;
    currentEncoded = encodeBase64(combined);

    // Show encoded string and OTP message
    document.getElementById('encodedText').textContent = "Encoded: " + currentEncoded;

    // All users receive OTP via SMS/phone
    document.getElementById('otpSubtext').textContent =
      'A 6-digit code has been sent to ' + masked + '.';
    // Hide QR code container (not needed for production OTP verification)
    document.getElementById('qrcodeContainer').style.display = 'none';
  }

  // Auto-advance between boxes
  inputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/, '');
      if (inp.value) inp.classList.add('filled'); else inp.classList.remove('filled');
      if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
      if ([...inputs].every(x => x.value)) verifyOTP();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && i > 0) {
        inputs[i - 1].focus();
        inputs[i - 1].classList.remove('filled');
      }
    });
    inp.addEventListener('paste', e => {
      e.preventDefault();
      const text = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
      [...text].forEach((ch, j) => {
        if (inputs[j]) { inputs[j].value = ch; inputs[j].classList.add('filled'); }
      });
      if (inputs[text.length - 1]) inputs[text.length - 1].focus();
      if (text.length === 6) setTimeout(verifyOTP, 100);
    });
  });

  function showAlert(msg, type) {
    const el = document.getElementById('otpAlert');
    el.textContent = msg;
    el.className = 'auth-alert show ' + type;
  }

  async function verifyOTP() {
    const code = [...inputs].map(i => i.value).join('');

    if (code.length < 6) {
      showAlert('Please enter all 6 digits.', 'error');
      return;
    }

    const userSession = JSON.parse(sessionStorage.getItem('otp_user') || 'null');
    if (!userSession) {
      showAlert('Session expired. Please log in again.', 'error');
      setTimeout(() => { location.href = 'login.html'; }, 1500);
      return;
    }

    const btn = document.getElementById('verifyBtn');
    btn.disabled = true;
    btn.textContent = 'Verifying…';

    try {
      // Verify OTP using SHA-256 based on encoded string
      const isValid = await verifyCode(currentEncoded, code);

      if (isValid) {
        sessionStorage.setItem('current_user', JSON.stringify(userSession));
        showAlert('✅ Verified!', 'success');
        setTimeout(() => { location.href = 'role-select.html'; }, 900);
      } else {
        showAlert('❌ Incorrect code. Please try again.', 'error');
        inputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
        inputs[0].focus();
        btn.disabled = false;
        btn.textContent = 'Verify & Login →';
      }
    } catch (error) {
      console.error('Verification error:', error);
      showAlert('Verification failed. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Verify & Login →';
    }
  }

  inputs[0].focus();
</script>
