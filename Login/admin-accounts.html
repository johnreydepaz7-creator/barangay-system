<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accounts — Barangay 59-A</title>
  <link rel="stylesheet" href="auth-base.css">
  <link rel="stylesheet" href="auth-components.css">
  <link rel="stylesheet" href="responsive.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    #qrcodeModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    #qrcodeModal.show {
      display: flex;
    }
    .qrcode-modal-content {
      background: white;
      border-radius: 12px;
      padding: 42px 30px 24px;
      text-align: center;
      width: min(92vw, 390px);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }
    .qrcode-modal-content h3 {
      margin: 0 0 10px 0;
      color: var(--text-main);
    }
    .qrcode-modal-content p {
      font-size: 12px;
      color: var(--text-muted);
      margin: 0 0 15px 0;
    }
    #qrcode {
      display: inline-block;
      padding: 10px;
      background: white;
      border-radius: 8px;
      margin: 15px 0;
    }
    #encodedText,
    .encoded-text,
    .qr-encoded-text,
    .qrcode-encoded-text {
      display: none !important;
      visibility: hidden !important;
      height: 0 !important;
      max-height: 0 !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .modal-x-close {
      position: absolute;
      top: 12px;
      right: 14px;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      color: #6b7280;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-x-close:hover {
      background: rgba(0, 0, 0, 0.06);
      color: #111827;
    }
    .modal-close-btn {
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      background: var(--green-600);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .modal-close-btn:hover {
      background: var(--green-700);
    }
  </style>
  <script src="/messagebox.js"></script>
</head>
<body>
<div class="auth-table-bg">

  <div style="width:100%; max-width:960px;">

    <!-- Header -->
    <div class="table-page-header">
      <div style="display:flex; align-items:center; gap:16px;">
        <button class="table-page-back" onclick="location.href='admin-menu.html'">← Back</button>
        <div>
          <div class="section-title">Registered Accounts</div>
          <div style="font-size:12.5px; color:var(--text-muted); margin-top:2px;">All approved barangay staff</div>
        </div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <div class="table-search">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Search…" oninput="filterTable()">
        </div>
        <button class="btn-primary" onclick="location.href='admin-add.html'"
          style="width:auto; padding:10px 20px; font-size:13.5px;">+ Add Account</button>
      </div>
    </div>

    <div class="auth-alert" id="tableAlert" style="margin-bottom:16px;"></div>

    <div class="auth-table-wrap">
      <table class="auth-table" id="accountsTable">
        <thead>
          <tr>
            <th>Last Name</th>
            <th>First Name</th>
            <th>Middle Name</th>
            <th>Role</th>
            <th>Phone</th>
            <th>Date Added</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="accountsTbody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        <div class="empty-icon">👥</div>
        <div class="empty-title">No accounts yet</div>
        <div class="empty-desc">Add a new account to get started.</div>
      </div>
    </div>

  </div>
</div>
<div id="qrcodeModal"></div>

<script>
  // Hidden secret key
  const SECRET = "l69xAAm3";

  // Base64 encode
  function encodeBase64(str) {
    return btoa(str);
  }

  const user=JSON.parse(sessionStorage.getItem('current_user')||'null');
  if(!user){location.href='login.html';}

  const badgeClass={'Punong Barangay':'pb'};
  function getBadge(role){return badgeClass[role]||'staff';}

  function closeQRCodeModal() {
    const modal = document.getElementById('qrcodeModal');
    if (modal) {
      modal.classList.remove('show');
      modal.innerHTML = '';
    }
  }

  function showQRCode(firstName, middleName, lastName, phone) {
    // Combine: firstName + middleName + lastName + "|" + phone + "|" + SECRET
    const fullName = (firstName + ' ' + middleName + ' ' + lastName).trim();
    const combined = fullName + '|' + phone + '|' + SECRET;
    const encoded = encodeBase64(combined);

    // Create modal content
    const modal = document.getElementById('qrcodeModal');
    modal.innerHTML = `
      <div class="qrcode-modal-content">
        <button class="modal-x-close" type="button" aria-label="Close QR Code" onclick="closeQRCodeModal()">&times;</button>
        <h3>QR Code for ${fullName}</h3>
        <p>Share this QR code with the staff member for login</p>
        <div id="qrcode" style="display:inline-block; padding:10px; background:white; border-radius:8px;"></div>
      </div>
    `;

    // Generate QR code
    const qrcodeDiv = modal.querySelector('#qrcode');
    qrcodeDiv.innerHTML = '';
    new QRCode(qrcodeDiv, {
      text: encoded,
      width: 200,
      height: 200,
      colorDark: '#1f6f43',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.H
    });

    // Show modal
    modal.classList.add('show');
  }

  document.getElementById('qrcodeModal').addEventListener('click', function(e) {
    if (e.target === this) closeQRCodeModal();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeQRCodeModal();
  });

  function renderTable(data){
    const tbody=document.getElementById('accountsTbody');
    const table=document.getElementById('accountsTable');
    const empty=document.getElementById('emptyState');
    tbody.innerHTML='';
    if(!data||data.length===0){table.style.display='none';empty.style.display='block';return;}
    table.style.display='';empty.style.display='none';
    data.forEach(u=>{
      const tr=document.createElement('tr');
      const createdDate = new Date(u.createdAt).toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
      tr.innerHTML=`
        <td><strong>${u.lastName||'—'}</strong></td>
        <td>${u.firstName||'—'}</td>
        <td>${u.middleName||'—'}</td>
        <td><span class="role-badge ${getBadge(u.role)}">${u.role||'—'}</span></td>
        <td style="font-family:monospace;font-size:13px;">${u.phone||'—'}</td>
        <td style="color:var(--text-muted);font-size:12.5px;">${createdDate}</td>
        <td style="display:flex; gap:8px;">
          <button class="btn-primary" onclick="showQRCode('${u.firstName}', '${u.middleName}', '${u.lastName}', '${u.phone}')" style="padding:6px 12px; font-size:12px; width:auto;">QR Code</button>
          <button class="btn-danger" onclick="deleteAccount('${u._id}')" style="padding:6px 12px; font-size:12px; width:auto;">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function loadAccounts(){
    try {
      const response = await fetch('/api/accounts');
      if (!response.ok) throw new Error('Failed to load accounts');
      const accounts = await response.json();
      // Filter for approved accounts only, excluding Punong Barangay
      const approved = accounts.filter(u => u.status === 'approved' && u.role !== 'Punong Barangay');
      renderTable(approved);
      return approved;
    } catch (error) {
      console.error('Error loading accounts:', error);
      const el = document.getElementById('tableAlert');
      el.textContent = 'Error loading accounts. Please refresh the page.';
      el.className = 'auth-alert show error';
    }
  }

  async function deleteAccount(id){
    if(!(await BrgyMessageBox.confirm('Are you sure you want to delete this account? This action cannot be undone.'))) return;
    
    const deleteBtn = event.target;
    deleteBtn.disabled = true;
    deleteBtn.textContent = 'Deleting...';

    try {
      const response = await fetch(`/api/accounts/${id}`, {
        method: 'DELETE',
        headers: {
          'Content-Type': 'application/json'
        }
      });

      const data = await response.json();

      if (response.ok) {
        const el = document.getElementById('tableAlert');
        el.textContent = 'Account deleted successfully.';
        el.className = 'auth-alert show success';
        setTimeout(() => {
          el.className = 'auth-alert';
        }, 3000);
        // Reload the accounts list
        await loadAccounts();
      } else {
        throw new Error(data.message || 'Failed to delete account');
      }
    } catch (error) {
      console.error('Delete error:', error);
      const el = document.getElementById('tableAlert');
      el.textContent = 'Error deleting account: ' + error.message;
      el.className = 'auth-alert show error';
      deleteBtn.disabled = false;
      deleteBtn.textContent = 'Delete';
    }
  }

  loadAccounts();
</script>
</body>
</html>
